<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>行序 · LineRename</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #26272e; --line: #3a3b44; --fg: #e8e8ec;
    --dim: #9a9ba6; --accent: #4f8cff; --ok: #4caf7d; --warn: #e0a13e; --err: #e05e5e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    user-select: none;
  }
  header {
    padding: 10px 14px 6px; font-size: 15px; font-weight: 600;
  }
  header .sub { font-size: 12px; font-weight: 400; color: var(--dim); margin-left: 8px; }
  main { flex: 1; display: flex; gap: 10px; padding: 8px 14px; min-height: 0; }
  .left { display: flex; flex-direction: column; width: 38%; min-width: 220px; gap: 6px; }
  .left label { color: var(--dim); font-size: 12px; }
  textarea {
    flex: 1; resize: none; padding: 8px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; outline: none;
    font: 13px/1.7 Consolas, "Microsoft YaHei", monospace;
    user-select: text;
  }
  textarea:focus { border-color: var(--accent); }
  .right { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--fg); cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chk { display: flex; align-items: center; gap: 4px; margin-left: auto; color: var(--dim); }
  .table-wrap {
    flex: 1; overflow: auto; min-height: 0;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 5px 10px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--dim);
       font-weight: 500; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid #2e2f36; font-family: Consolas, "Microsoft YaHei", monospace; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: default; }
  tbody tr:hover { background: #2c2d35; }
  tbody tr.sel { background: #2f3a52; }
  td.num { color: var(--dim); width: 34px; }
  td.ready { color: var(--ok); }
  td.swap { color: var(--warn); }
  td.skip { color: var(--err); }
  footer {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px;
  }
  #status { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>行序 · LineRename<span class="sub">每行一个名称，与右侧文件按顺序对应</span></header>
<main>
  <section class="left">
    <label for="names">名称列表</label>
    <textarea id="names" spellcheck="false" placeholder="第一行名称&#10;第二行名称&#10;第三行名称…"></textarea>
  </section>
  <section class="right">
    <div class="toolbar">
      <button id="btnAdd">添加文件…</button>
      <button id="btnSort">排序</button>
      <button id="btnUp" title="上移选中项">↑</button>
      <button id="btnDown" title="下移选中项">↓</button>
      <button id="btnClear">清空</button>
      <label class="chk"><input type="checkbox" id="keepExt" checked>保留原扩展名</label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>原名称</th><th>目标名称</th><th>状态</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<footer>
  <button id="btnUndo">撤销上次</button>
  <span id="status">就绪</span>
  <button id="btnRename" class="primary">开始重命名</button>
</footer>
<script>
const { invoke } = window.__TAURI__.core;
const $ = id => document.getElementById(id);
let rows = [];
let selected = -1;
let busy = false;

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setStatus(t) { $('status').textContent = t; }
function setBusy(b) {
  busy = b;
  ['btnAdd','btnSort','btnUp','btnDown','btnClear','btnUndo','btnRename'].forEach(id => $(id).disabled = b);
}

async function refresh() {
  try {
    rows = await invoke('preview', { names: $('names').value, keepExt: $('keepExt').checked });
    if (selected >= rows.length) selected = rows.length - 1;
    render();
  } catch (e) { setStatus(String(e)); }
}

function render() {
  const tb = $('rows');
  tb.innerHTML = '';
  const frag = document.createDocumentFragment();
  rows.forEach(r => {
    const tr = document.createElement('tr');
    if (r.index === selected) tr.className = 'sel';
    const target = r.targetName ? esc(r.targetName) : '<span style="color:var(--dim)">—</span>';
    tr.innerHTML =
      `<td class="num">${r.index + 1}</td>` +
      `<td>${esc(r.sourceName)}${r.isDir ? ' <span style="color:var(--dim)">[目录]</span>' : ''}</td>` +
      `<td>${target}</td>` +
      `<td class="${r.statusKind}">${esc(r.statusText)}</td>`;
    tr.onclick = () => { selected = r.index; render(); };
    frag.appendChild(tr);
  });
  tb.appendChild(frag);
  const ready = rows.filter(r => r.statusKind === 'ready' || r.statusKind === 'swap').length;
  if (!busy) setStatus(rows.length ? `${rows.length} 个文件，${ready} 个待重命名` : '就绪');
}

let timer = null;
$('names').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(refresh, 200);
});
$('keepExt').addEventListener('change', refresh);

$('btnAdd').onclick = async () => {
  setBusy(true);
  try {
    const paths = await invoke('pick_files');
    if (paths.length) {
      await invoke('add_paths', { paths });
      await refresh();
    }
  } catch (e) { setStatus(String(e)); }
  setBusy(false);
};
$('btnSort').onclick = async () => { setBusy(true); try { await invoke('sort_items'); await refresh(); } catch (e) { setStatus(String(e)); } setBusy(false); };
$('btnUp').onclick = async () => { if (selected < 0) return; setBusy(true); try { await invoke('move_item', { index: selected, delta: -1 }); selected -= 1; await refresh(); } catch (e) { setStatus(String(e)); } setBusy(false); };
$('btnDown').onclick = async () => { if (selected < 0) return; setBusy(true); try { await invoke('move_item', { index: selected, delta: 1 }); selected += 1; await refresh(); } catch (e) { setStatus(String(e)); } setBusy(false); };
$('btnClear').onclick = async () => { setBusy(true); try { await invoke('clear_items'); selected = -1; await refresh(); } catch (e) { setStatus(String(e)); } setBusy(false); };

$('btnRename').onclick = async () => {
  const targets = rows.filter(r => r.statusKind === 'ready' || r.statusKind === 'swap');
  if (!targets.length) { setStatus('没有可执行的重命名'); return; }
  if (!confirm(`将把 ${targets.length} 项重命名，确认继续？`)) return;
  setBusy(true);
  try {
    const out = await invoke('rename', { names: $('names').value, keepExt: $('keepExt').checked });
    setStatus(`重命名完成：${out.moved} 项` + (out.skipped.length ? `；跳过 ${out.skipped.join('，')}` : ''));
    await refresh();
  } catch (e) { setStatus(String(e)); }
  setBusy(false);
};

$('btnUndo').onclick = async () => {
  setBusy(true);
  try {
    const msg = await invoke('undo');
    setStatus(msg);
    await refresh();
  } catch (e) { setStatus(String(e)); }
  setBusy(false);
};

window.__TAURI__.webviewWindow.getCurrentWebviewWindow().onDragDropEvent(e => {
  if (e.payload.type === 'drop' && e.payload.paths && e.payload.paths.length) {
    invoke('add_paths', { paths: e.payload.paths })
      .then(refresh)
      .catch(err => setStatus(String(err)));
  }
});

refresh();
</script>
</body>
</html>
